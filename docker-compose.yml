services:
  db:
    image: postgres:17
    container_name: seguimiento-remates-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remates}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remates}
      POSTGRES_DB: ${POSTGRES_DB:-remates}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
